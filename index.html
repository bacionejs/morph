<canvas id=C width=400 height=400 style=width:100dvmin;height:100dvmin><script>
let c=C.getContext`2d`,I=0,P=0,T,A,B,
G=n=>String.fromCodePoint(127793+n),
trace=e=>{
  C.width=400;c.font='220px serif';c.textAlign='center';c.fillText(e,200,215);
  let d=c.getImageData(0,0,400,400).data,r=[],dx=[1,1,0,-1,-1,-1,0,1],dy=[0,1,1,1,0,-1,-1,-1],x,y,sx,sy,dir=0,k=0;
  for(;k<400*400;k++)if(d[k*4+3]>19&&x==null)sx=x=k%400,sy=y=k/400|0;
  if(x!=null)do{
    r.push({x,y});
    for(let j=0;j<8;j++){
      let n=(dir+5+j)%8,nx=x+dx[n],ny=y+dy[n];
      if(d[(ny*400+nx)*4+3]>19){x=nx;y=ny;dir=n;break}
    }
  }while((x!=sx||y!=sy)&&r.length<5000);
  r[0]||(r=[{x:200,y:200}]);
  return[...Array(800)].map((_,j)=>r[j*r.length/800|0])
};
(function morph(t){
  let dt=(t-T)/1000||0,e,f,j=0;T=t;
  A||(A=trace(G(I)),B=trace(G(I+1)));
  if((P+=dt*.8)>=1)A=B,I++,B=trace(G(I+1)),P=0;
  C.width=400;c.fillStyle='black';
  e=P*P*(3-2*P);f=1-e;
  c.beginPath();
  for(;j<800;j++)c[j?'lineTo':'moveTo'](A[j].x*f+B[j].x*e,A[j].y*f+B[j].y*e);
  c.fill();
  requestAnimationFrame(morph)
})(0)
</script>
